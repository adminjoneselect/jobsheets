<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#1d2321;--mute:#6b736f;--line:#dfe2dd;--acc:#1f6f4a;--acc2:#e7f2ec;--warn:#b5481d;--r:12px}
@media (prefers-color-scheme:dark){:root{--bg:#141716;--card:#1d2120;--ink:#eef1ee;--mute:#9aa39e;--line:#303633;--acc:#4fbf8a;--acc2:#1e3329;--warn:#ef8a5e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:12px 16px;max-width:900px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:6}
nav.tabs button{flex:1;border:0;background:none;padding:10px 0 14px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.mute{color:var(--mute);font-size:13px}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--acc2);color:var(--acc);font-weight:600;white-space:nowrap}
.pill.done{background:var(--line);color:var(--mute)}
.pill.wip{background:#fdeee4;color:var(--warn)}
button,.btn{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;cursor:pointer}
.btn.pri,button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.ghost{background:none;border:0;color:var(--acc);padding:6px 4px;font-weight:600}
button.danger{color:var(--warn)}
button:disabled{opacity:.5}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:18px 0 8px;display:flex;align-items:center}
h2 span{flex:1}
.list-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list-item:last-child{border-bottom:0}
.num{font-variant-numeric:tabular-nums}
.big{font-size:20px;font-weight:700}
.search{margin-bottom:10px}
.chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chips button{padding:5px 12px;font-size:13px;border-radius:99px}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.phgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;background:var(--line)}
table.wk{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
table.wk th,table.wk td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center;vertical-align:top}
table.wk td[data-d]{cursor:pointer}
.oc{font-size:9px;font-weight:700;color:var(--warn);letter-spacing:.03em}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chips.scroll button{white-space:nowrap;flex:none}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#modal.hidden{display:none}
#modal .sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:700px){#modal{align-items:center}#modal .sheet{border-radius:16px}}
.sheet h3{margin:0 0 6px;font-size:18px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
#upd{display:none;background:#e3f1e8;color:#14532d;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
#banner{display:none;background:#fdeee4;color:#7a2f0f;padding:10px 16px;font-size:14px}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
/* timesheet form look */
.tsWrap{overflow-x:auto;background:#fff;border-radius:6px;padding:14px;border:1px solid var(--line);color:#000}
.tsPaper{min-width:760px;font-family:"Times New Roman",Times,serif;color:#000}
.tsPaper .tt{font-weight:bold;font-style:italic;font-size:17px;margin-bottom:4px}
.tsPaper table{border-collapse:collapse;width:100%;table-layout:fixed}
.tsPaper td,.tsPaper th{border:1px solid #000;padding:2px 5px;height:26px;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tsPaper th{font-weight:normal;font-size:13px;height:36px;line-height:1.1}
.tsPaper .ft{display:flex;font-weight:bold;font-style:italic;font-size:15px;margin-top:4px}
.mat-total{display:flex;justify-content:space-between;padding-top:8px;font-weight:700}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}
.progress div{height:100%;background:var(--acc);width:0}
.maptbl{width:100%;font-size:12px;border-collapse:collapse;margin-top:8px}
.maptbl td{border-bottom:1px solid var(--line);padding:4px;max-width:120px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
</style>
</head>

</nav>

const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const parseD = s => { const [y,m,d] = (s||"").split("-").map(Number); return new Date(y, (m||1)-1, d||1); };

const fmtD = s => s ? parseD(s).toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"}) : "";
const fmtDAU = s => { if(!s) return ""; const [y,m,d]=s.split("-"); return d+"/"+m+"/"+y; };
const addDays = (s,n) => { const d=parseD(s); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const mins = t => { if(!t) return null; const [h,m]=t.split(":").map(Number); return h*60+m; };
const grossMin = e => { const a=mins(e.start), b=mins(e.finish); if(a==null||b==null) return 0; let x=b-a; if(x<0)x+=1440; return x; };
const netHrs = e => Math.max(0, grossMin(e) - lunchMinFor(e)) / 60;   // lunch comes off the job it fell in
const hrs = n => { const r = Math.round(n*100)/100; return (r % 1 === 0 ? r.toFixed(0) : String(r)); };

const APP_VERSION = "2026.11.13.2";   // must match APP_VERSION in Code.gs
const verNum = v => String(v||"0").split(".").map(n=>parseInt(n,10)||0);
const verCmp = (a,b) => { const x=verNum(a), y=verNum(b); for(let i=0;i<Math.max(x.length,y.length);i++){ const d=(x[i]||0)-(y[i]||0); if(d) return d; } return 0; };
/* compare this page with the Google script after each load */
/* versions are shown as the date they were made, e.g. "13 Nov 2026" */
const verDate = v => { const [y,m,d] = verNum(v); return y ? `${d} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1]} ${y}` : ""; };
const verLine = () => `<div class="card" style="text-align:center"><div class="mute">App version</div><div style="font-size:20px;font-weight:700">${verDate(APP_VERSION)}</div>${S.serverVersion && verCmp(S.serverVersion, APP_VERSION) ? `<div class="mute">Google script: ${esc(verDate(S.serverVersion))}</div>` : ""}</div>`;
function checkVersion(server){
  S.serverVersion = server || "";
  const u = $("#upd"); if(!u) return;
  if(server && verCmp(server, APP_VERSION) > 0){
    u.textContent = `A new version of the app (${verDate(server)}) is ready – tap here to update`;
    u.onclick = async () => { u.textContent = "Updating…";
      try { const r = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if(r) await r.update(); } catch(e){}
      location.reload(); };
    u.style.display = "block";
  } else if(server && verCmp(server, APP_VERSION) < 0 && S.isAdmin){
    u.textContent = `Admin: the Google script is still the ${verDate(server)} version. In Apps Script, paste the new Code.gs and deploy a new version.`;
    u.onclick = null; u.style.display = "block";
  } else u.style.display = "none";
}

function writeErr(e){
  console.error(e);
  if(e && e.code==="auth"){ toast("Please sign in again."); signOut(); }
  else if(e && (e.code==="forbidden" || e.code==="bad")) toast(e.message);
  else if(e && e.code==="unavailable") toast("Couldn't reach the sheet – check your signal and try again.");
  else toast((e && e.message) || "Something went wrong – try again.");
}

/* ---------- Google Apps Script wiring ---------- */
/* The app talks to the Google Apps Script back end. Hosted on GitHub Pages it uses fetch() to the web app URL in
   config.js; opened straight from the Apps Script link it uses google.script.run. Both reach the same api(). */
const API_URL = (window.APP_CONFIG && window.APP_CONFIG.apiUrl) || "";
function authFor(){ return S.me ? Object.assign({}, S.me, {code: lsGet("code", "")}) : null; }
/* the access code was changed or is missing: ask for it again (name and PIN are kept) */
function codeGone(action, e){ if(e && e.code==="code" && action!=="names"){ lsSet("code", null); location.reload(); return true; } return false; }
function call(action, payload){
  return call0(action, payload).catch(e => { if(codeGone(action, e)) return new Promise(()=>{}); throw e; });
}
function call0(action, payload){
  if(window.google && google.script && google.script.run){
    return new Promise((res, rej) => {
      google.script.run
        .withSuccessHandler(r => { if(r && r.error) rej({code:r.code||"error", message:r.error}); else res(r); })
        .withFailureHandler(e => rej({code:"unavailable", message:String((e && e.message) || e)}))
        .api(action, authFor(), payload == null ? null : payload);
    });
  }
  if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(API_URL))
    return Promise.reject({code:"bad", message:"This app isn't connected to its Google Sheet yet. Put the Apps Script web app URL (ending in /exec) into config.js."});
  return fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, redirect:"follow",
                         body: JSON.stringify({action, auth:authFor(), payload: payload == null ? null : payload})})
    .then(r => { if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(r => { if(r && r.error) throw {code:r.code||"error", message:r.error}; return r; },
          e => { throw (e && e.code) ? e : {code:"unavailable", message:"Couldn't reach the Google Sheet – check your signal. (" + String((e && e.message) || e) + ")"}; });
}
async function loadAll(quiet){
  try {
    const r = await call("load");
    S.settings = Object.assign(clone(DEFAULT_SETTINGS), r.settings || {}, {workers: r.workers || []});
    S.isAdmin = !!r.isAdmin; S.jobs = r.jobs || []; S.hours = r.hours || []; S.onCall = r.onCall || []; S.lunches = r.lunches || []; S.orders = r.orders || null; S.push = r.push || null;
    if(r.mustChangePin && !$("#pinNew")){ choosePin(true); return; }
    lsSet("tsOnlyMe", !!(r.settings && r.settings.tsOnly) && !r.isAdmin);
    checkVersion(r.version);
    S.ready.jobs = S.ready.set = true; banner(""); render();
  } catch(e){
    if(e.code==="auth"){ signOut(); return; }
    if(!quiet) banner(e.code!=="unavailable" && e.message ? e.message : "Can't reach the sheet – check your connection. Showing what's loaded." + (e.message ? " [" + e.message.replace(/^Couldn't reach the Google Sheet – check your signal\. /,"") + "]" : ""));
    S.ready.jobs = S.ready.set = true; render();
  }
}
async function loadInv(){ try { S.items = await call("inventory") || []; } catch(e){ console.error(e); } S.ready.inv = true; render(); }

}

/* ---------- writes ---------- */
async function saveJob(job){
  const body = clone(job);
  await call("saveJob", body);
  const i = S.jobs.findIndex(x => x.id===job.id);
  if(i>=0) S.jobs[i] = body; else S.jobs.push(body);
  render();
}
async function saveSettings(s){ await call("saveSettings", clone(s)); if(s.accessCode) lsSet("code", s.accessCode); await loadAll(true); }
async function upsertItem(item, oldKey){
  await call("saveItem", {item, oldKey: oldKey || null});
  const key = oldKey || itemKey(item);
  const i = S.items.findIndex(x => itemKey(x)===key);
  if(i>=0) S.items[i] = item; else S.items.push(item);
  render();
}
async function deleteItem(item){
  await call("deleteItem", {key: itemKey(item)});
  S.items = S.items.filter(x => itemKey(x)!==itemKey(item)); render();
}
async function replaceInventory(items, onProg){
  const CH = 1500;
  if(!items.length){ await call("importInventory", {items:[], reset:true}); }
  for(let i=0;i<items.length;i+=CH){
    await call("importInventory", {items:items.slice(i,i+CH), reset:i===0});
    onProg && onProg(Math.min(1,(i+CH)/items.length));
  }
  S.items = items; render();
}

/* ---------- render core ---------- */
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { S.view=b.dataset.v; S.jobId=null; render(true); window.scrollTo(0,0); });
$("#backBtn").onclick = () => { S.jobId=null; render(true); };
let lastView = "";
function render(force){
  const key = S.view + "|" + (S.jobId||"");
  const a = document.activeElement, aid = a && a.id, sel = a && a.selectionStart;
  if(!force && key===lastView && ["jobQ","invQ"].includes(aid)){ // only refresh lists while typing
    if(aid==="jobQ") renderJobList(); else renderInvList(); return;
  }
  if(!force && key===lastView && S.view==="settings") return; // don't wipe unsaved edits
  if(tsOnlyMe() && (S.view==="jobs" || S.view==="inventory")){ S.view = "timesheet"; S.jobId = null; }
  if(tsOnlyMe()) S.ts.worker = S.me.name;
  document.querySelectorAll('nav.tabs button[data-v="jobs"], nav.tabs button[data-v="inventory"]').forEach(b => b.style.display = tsOnlyMe() ? "none" : "");
  lastView = S.view + "|" + (S.jobId||"");
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.v===S.view));
  $("#backBtn").style.display = S.jobId ? "" : "none";
  $("#topAct").innerHTML = "";
  if(S.view==="jobs") S.jobId ? viewJob() : viewJobs();
  else if(S.view==="timesheet") viewTimesheet();
  else if(S.view==="inventory") viewInventory();
  else viewSettings();
  if(aid && $("#"+aid) && aid!=="sheet"){ const el=$("#"+aid); el.focus(); try{ if(sel!=null) el.setSelectionRange(sel,sel); }catch(e){} }
}

function confirmBox(msg, yes="Delete"){
  return new Promise(res => {
    openModal(`<h3>Are you sure?</h3><p>${esc(msg)}</p><div class="actions"><button id="cNo">Cancel</button><button class="pri" id="cYes" style="background:var(--warn);border-color:var(--warn)">${esc(yes)}</button></div>`);

/* ---------- JOBS ---------- */
function jobHours(j){ return (j.labour||[]).reduce((s,e)=>s+netHrs(e),0); }
function jobMat(j){ return (j.materials||[]).reduce((s,m)=>s+(Number(m.qty)||0)*(Number(m.p)||0),0); }
function lastDate(j){ const ds=(j.labour||[]).map(e=>e.date).filter(Boolean).sort(); return ds[ds.length-1] || j.date || ""; }
function nextJobNo(){
  const ns = S.jobs.map(j=>parseInt(String(j.jobNo).replace(/\D/g,""),10)).filter(n=>!isNaN(n));
  return ns.length ? String(Math.max(...ns)+1) : "1001";
}

  $("#title").textContent = "Jobs";

function renderJobList(){
  const box = $("#jobList"); if(!box) return;
  if(!S.ready.jobs){ box.innerHTML = `<div class="empty">Loading jobs…</div>`; return; }
  const terms = S.jobQ.toLowerCase().split(/\s+/).filter(Boolean);
  let js = S.jobs.filter(j => S.jobF==="all" || (S.jobF==="open" ? j.status!=="complete" : j.status==="complete"))
    .filter(j => { const h=(j.jobNo+" "+j.customer+" "+(j.address||"")+" "+(j.desc||"")).toLowerCase(); return terms.every(t=>h.includes(t)); })
    .sort((a,b)=> (lastDate(b)).localeCompare(lastDate(a)) || String(b.jobNo).localeCompare(String(a.jobNo), undefined, {numeric:true}));
  if(!js.length){ box.innerHTML = `<div class="empty">${S.jobs.length ? "No jobs match." : "No jobs yet. Tap <b>+ New job</b> to start your first job card."}</div>`; return; }
  box.innerHTML = `<div class="card" style="padding:2px 14px">` + js.map(j => `

}

function workerOpts(sel){
  const ws = S.settings.workers||[];
  const names = ws.map(w=>w.name);
  if(sel && !names.includes(sel)) names.push(sel);
  return names.map(n=>`<option ${n===sel?"selected":""}>${esc(n)}</option>`).join("") + `<option value="__new">+ Someone else…</option>`;
}
function regoFor(name){ const w=(S.settings.workers||[]).find(w=>w.name===name); return w ? (w.rego||"") : ""; }

function editLabour(job, idx){
  const isNew = idx==null;
  const defWorker = (S.me && S.me.name) || "";
  const e = isNew ? {date:today(), worker:defWorker, start:"07:00", finish:"15:30", lunch:0, rego:regoFor(defWorker), wip:job.status!=="complete", desc:""} : clone(job.labour[idx]);
  const noWorkers = !(S.settings.workers||[]).length;
  openModal(`<h3>${isNew?"Add labour":"Edit labour"} – #${esc(job.jobNo)}</h3>
    <div class="grid2"><div><label>Date</label><input id="lDate" type="date" value="${esc(e.date)}"></div>
    <div><label>Worker</label>${noWorkers?`<input id="lWorkerT" value="${esc(e.worker)}" placeholder="Name">`:`<select id="lWorker">${workerOpts(e.worker)}</select><input id="lWorkerT" placeholder="Name" style="display:none;margin-top:6px">`}</div></div>
    <div class="grid2"><div><label>Start</label><input id="lStart" type="time" value="${esc(e.start)}"></div>
    <div><label>Finish</label><input id="lFin" type="time" value="${esc(e.finish)}"></div></div>
    <div id="luWrap">${lunchHTML(e.worker, e.date)}</div>
    <div class="grid2"><div><label>Vehicle rego</label><input id="lRego" value="${esc(e.rego)}" style="text-transform:uppercase"></div>
    <div><label>&nbsp;</label><label style="display:flex;gap:8px;align-items:center;text-transform:none;font-size:15px;color:var(--ink);font-weight:400;margin:0;padding:9px 0"><input type="checkbox" id="lWip" style="width:auto" ${e.wip?"checked":""}> Job still in progress (WIP)</label></div></div>
    <label>What was done</label><textarea id="lDesc" placeholder="e.g. Rough-in kitchen, ran circuits to switchboard">${esc(e.desc)}</textarea>
    <div class="mute" id="lHrs" style="margin-top:8px"></div>
    <div class="actions">${isNew?"":`<button class="danger" id="lDel" style="margin-right:auto">Delete</button>`}<button id="mCancel">Cancel</button><button class="pri" id="mSave">Save</button></div>`);
  const wSel = $("#lWorker"), wT = $("#lWorkerT");
  const curWorker = () => (!wSel || wSel.value==="__new") ? wT.value.trim() : wSel.value;
  const upd = () => { const x={start:$("#lStart").value, finish:$("#lFin").value}; const L = readLunch(); const lm = overlapWith(x, L);
    $("#lHrs").textContent = `Hours on this job: ${hrs(Math.max(0,grossMin(x)-lm)/60)} (${hrs(grossMin(x)/60)} on site` + (L.none ? ", no lunch taken)" : lm ? `, less ${lm} min lunch)` : ", lunch not during this job)"); };
  const relunch = () => { $("#luWrap").innerHTML = lunchHTML(curWorker(), $("#lDate").value); bindLunch(upd); upd(); };
  ["lStart","lFin"].forEach(id => $("#"+id).oninput = upd); bindLunch(upd); upd();
  $("#lDate").onchange = relunch;
  if(wSel) wSel.onchange = () => { if(wSel.value==="__new"){ wT.style.display=""; wT.focus(); } else { wT.style.display="none"; const r=regoFor(wSel.value); if(r) $("#lRego").value=r; } relunch(); };
  $("#mCancel").onclick = closeModal;
  if(!isNew) $("#lDel").onclick = async () => { const x=clone(job); x.labour.splice(idx,1); try{ await saveJob(x); closeModal(); toast("Removed"); }catch(err){ writeErr(err); } };
  $("#mSave").onclick = async () => {
    const worker = (!wSel || wSel.value==="__new") ? wT.value.trim() : wSel.value;
    const L = readLunch();
    const ne = {date:$("#lDate").value, worker, start:$("#lStart").value, finish:$("#lFin").value, lunch:0,
      rego:$("#lRego").value.trim().toUpperCase(), wip:$("#lWip").checked, desc:$("#lDesc").value.trim()};
    if(!ne.date || !ne.worker){ toast("Date and worker are needed."); return; }
    if(!ne.start || !ne.finish){ toast("Enter start and finish times."); return; }
    if(!L.none && (!L.start || !L.finish)){ toast("Enter lunch start and finish, or tick No lunch taken."); return; }
    ne.lunch = overlapWith(ne, L);
    const x = clone(job); x.labour = x.labour||[]; if(isNew) x.labour.push(ne); else x.labour[idx]=ne;
    $("#mSave").disabled = true;
    try {
      await saveLunch(worker, ne.date, L);
      await saveJob(x);
      closeModal(); toast("Saved");
    } catch(err){ $("#mSave").disabled=false; writeErr(err); }
  };
}

function tidyDesc(desc){
  let d = " " + String(desc||"").toUpperCase().replace(/\s+/g," ") + " ";
  d = d.replace(/\b[A-Z0-9]*\d{4,}(\.\d+)\s?MM2/g," 0$1MM2 ");                          // FODT12402B1000.75MM2 → 0.75mm²
  d = d.replace(/(^|[^\d])\.(\d+)\s?MM2/g,"$10.$2MM2");                                        // .75MM2 → 0.75mm²
  d = d.replace(/-BU\b|-SI\b/g," ").replace(/\(\d+\)/g," ").replace(/-?USE \d{6,}/g," ").replace(/\bPOA\b|\(POA\)/g," ");
  // sizes: H108XW108XD76MM -> 108x108x76mm ; W75XL145MM -> 75x145mm
  d = d.replace(/\b[HWLD]?(\d+(?:\.\d+)?)X[HWLD]?(\d+(?:\.\d+)?)(?:X[HWLD]?(\d+(?:\.\d+)?))?\s?MM\b/g, (_,a,b,c) => " " + a + "×" + b + (c ? "×" + c : "") + "mm ");
  d = d.replace(/\bDIA\s?(\d+(?:\.\d+)?)\s?MM\b/g," $1mm dia ").replace(/\bW(\d+(?:\.\d+)?)MM\b/g," $1mm wide ").replace(/\bL(\d+(?:\.\d+)?)MM\b/g," $1mm long ")
       .replace(/\bL(\d+(?:\.\d+)?)M\b/g," $1m long ").replace(/\bTHK(\d+(?:\.\d+)?)MM\b/g," $1mm thick ").replace(/\b(\d+(?:\.\d+)?)MM2\b/g," $1mm² ").replace(/\b(\d+(?:\.\d+)?)MM\b/g," $1mm ")
       .replace(/\b(\d+)VAC\b/g," $1V AC ").replace(/\b(\d+)VDC\b/g," $1V DC ").replace(/\b(\d+)PK\b/g," $1 pack ").replace(/\b(\d+(?:\.\d+)?)M\b(?!M)/g," $1m ");
  const words = d.trim().split(" ").filter(Boolean);
  const out = [];
  for(const w of words){
    if(w in ABBR){ if(ABBR[w]) out.push(ABBR[w]); continue; }
    if(/^[A-Z]{1,4}\d{3,}[A-Z0-9\-\/.]*$/.test(w) && !/^(IP|CAT|M|R|E|B|GU|MR|T)\d/.test(w)) continue;       // looks like a part number – drop
    if(/^\d{5,}$/.test(w)) continue;
    if(/^[A-Z]{1,2}\d+\/[A-Z]\d+$/.test(w)) continue;                                                          // packing codes like C6/P648
    if(/^[A-Z]{2,}$/.test(w) && w.length > 2) { out.push(w.toLowerCase()); continue; }
    out.push(/^[A-Z\/&-]+$/.test(w) ? w.toLowerCase() : w.replace(/MM\b/,"mm"));
  }
  let s = out.join(" ").replace(/\s+,/g,",").replace(/\s{2,}/g," ").trim();
  const realWords = s.split(" ").filter(w => /[a-z]{3,}/i.test(w)).length;
  if(realWords < 1) return "";                                         // description is only a code – nothing useful to say
  s = s.split(" ").slice(0, 10).join(" ");
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* ---------- CATALOGUE: suppliers → product types → products ---------- */
const TYPE_NAMES = ["Cable","Conduit & fittings","Cable support & tray","Connectors & terminations","Switchboards & protection","Power points & switches","Lighting","Data, TV & comms","Smoke alarms & safety","Earthing","Fans & heating","Solar & batteries","Fixings & consumables","Tools & testers","Poles, pits & street lighting","Motors & industrial","Other"];
function autoType(d){ d = String(d||"").toUpperCase(); for(const [n,rx] of TYPE_RULES) if(rx.test(d)) return n; return "Other"; }
const BRAND_PREFIX = {CLI:"Clipsal", HAG:"Hager", OLX:"Olex", EAT:"Eaton", NHP:"NHP", HPM:"HPM", ABB:"ABB"};
const itemKey = it => ((it.s||"") + "|" + (it.c||"")).toUpperCase();
const showPrices = () => !!S.settings.showPrices;
/* Timesheets-only mode: workers (not admins) just get Timesheet + Settings */
const tsOnlyMe = () => S.ready.set ? (!!S.settings.tsOnly && !S.isAdmin) : !!lsGet("tsOnlyMe", false);   // remembered so the phone opens straight on the timesheet
function suppliersOf(){ return [...new Set(S.items.map(i=>i.s||"").filter(Boolean))].sort((a,b)=>a.localeCompare(b)); }
function typesOf(sup){
  const m = new Map();
  S.items.forEach(i => { if(sup && i.s!==sup) return; const g = i.g||"Other"; m.set(g, (m.get(g)||0)+1); });
  return [...m.entries()].sort((a,b)=>TYPE_NAMES.indexOf(a[0])-TYPE_NAMES.indexOf(b[0]));
}
/* Everyday words → how wholesalers write them, so "double gpo" finds "POWERPOINT 2G…". Add more here any time. */
const SYNONYMS = {
  gpo:["powerpoint","power point","socket"], gpos:["powerpoint"], powerpoint:["gpo"], outlet:["powerpoint","socket","o/let"],
  single:["1g"," 1p "], double:["2g"], twin:["2g","2c+e","2c "], triple:["3g"], quad:["4g"],
  tps:["cable circ","cable flat","2c+e","3c+e","4c+e"], breaker:["mcb","circuit breaker","rcbo"], cb:["mcb","circuit breaker"],
  rcd:["rcbo","rcd"], safety:["rcbo","rcd"], smoke:["smoke alarm"], alarm:["smoke alarm","alarm"],
  jbox:["j/box","junction box","junction"], junction:["j/box","junction"], isolator:["isol","isolat"], iso:["isol","isolat"],
  data:["cat6","cat5","rj45","data"], ethernet:["cat6","rj45"], tv:["coax","f-type","antenna","tv"], earth:["e/wire","earth"],
  light:["light","lamp","led","batten","downlight"], globe:["lamp","globe"], tube:["lamp led tubular","tube"],
  series:["series","ser"], box:["box","enclosure","encl"], enclosure:["enclosure","box"], tape:["tape"], screw:["screw","scr"], nut:["nut"], bolt:["bolt"], circ:["cable circ","circ"], building:["building wire","bldg","b/wire"," 1c "], bw:["building wire"], sdi:["sdi"], conduit:["conduit"], saddle:["saddle"], gland:["gland"], tie:["cable tie","tie"], ties:["cable tie"], lugs:["lug"], lug:["lug"],
  switch:["switch","sw "], dimmer:["dimmer"], fan:["fan"], usb:["usb"], flex:["flex"],
  weatherproof:["w/p","weatherproof","ip5","ip6"], waterproof:["w/p","ip6","ip5"], outdoor:["w/p","ip5","ip6"], wp:["w/p"],
  black:["blk","black"], white:["wht","white"," we "], grey:["gry","grey"], red:["red"], orange:["org","orange"]
};
function termMatches(t, hay){
  if(hay.includes(t)) return true;
  const alts = SYNONYMS[t]; return !!(alts && alts.some(a => hay.includes(a)));
}
const PHRASES = [[/safety switch(es)?/g,"rcd"],[/power ?points?/g,"gpo"],[/junction box(es)?/g,"jbox"],[/circuit breakers?/g,"breaker"],
  [/smoke (alarm|detector)s?/g,"smoke"],[/twin (and|&) earth|t ?& ?e\b/g,"tps"],[/light switch(es)?/g,"switch"],[/down ?lights?/g,"downlight"]];
function filterItems(f, qs, n=80){
  let q = String(qs||"").toLowerCase(); PHRASES.forEach(([re,to]) => { q = q.replace(re, to); });
  const STOP = {the:1, a:1, an:1, for:1, with:1, of:1, and:1};
  const terms = q.split(/\s+/).filter(t => t && !STOP[t]);
  const out = S.items.filter(it => (!f.s || it.s===f.s) && (terms.length || !f.g || (it.g||"Other")===f.g) &&  // typing searches every type
    (!terms.length || (h => terms.every(t => termMatches(t, h)))(" " + ((it.k||"")+" "+(it.c||"")+" "+(it.d||"")+" "+(it.b||"")).toLowerCase() + " ")));
  out.sort((a,b) => (Number(b.n)||0)-(Number(a.n)||0) || String(a.d).localeCompare(String(b.d)));
  return {list: out.slice(0,n), total: out.length};
}

function fromParts(mat, job){ // work out the picker state from a saved material
  const s = mat.s || "";
  if(mat.from==="van" || /^van\b/i.test(s)) return {from:"van", rego:s.replace(/^van\s*/i,"") || vanRego(job, mat.date||today()), sup:""};
  if(mat.from==="workshop" || /^workshop$/i.test(s)) return {from:"workshop", rego:vanRego(job, mat.date||today()), sup:""};
  return {from:"supplier", rego:vanRego(job, mat.date||today()), sup:s};
}

/* ---------- Lunch break: one per person per day – start/finish times, or "No lunch taken" ---------- */
const lunchFor = (name, date) => (S.lunches||[]).find(l => l.name===name && l.date===date) || null;
function overlapWith(e, L){                     // minutes of this entry's time that fall inside the lunch break
  if(!L || L.none || !L.start || !L.finish) return 0;
  const s = mins(e.start), f0 = mins(e.finish), ls = mins(L.start), lf0 = mins(L.finish);
  if(s==null || f0==null || ls==null || lf0==null) return 0;
  const f = f0 < s ? f0 + 1440 : f0, lf = lf0 < ls ? lf0 + 1440 : lf0;
  return Math.max(0, Math.min(f, lf) - Math.max(s, ls));
}
function lunchMinFor(e){ const L = lunchFor(e.worker, e.date); return L ? overlapWith(e, L) : (Number(e.lunch)||0); }   // older entries kept minutes
function lunchText(L){ return !L ? "" : L.none ? "No lunch taken" : (L.start && L.finish ? `${L.start}–${L.finish}` : ""); }
function lunchHTML(worker, date){
  const L = lunchFor(worker, date);
  const d = L || {start:S.settings.lunchStart||"12:00", finish:S.settings.lunchFinish||"12:30", none:false};
  return `<div class="card" id="luBox" style="margin:12px 0 0;padding:10px 12px">
    <div class="row"><b class="grow">Lunch break</b><span class="mute" style="font-size:12px">${esc(worker||"")} · whole day</span></div>
    <label style="display:flex;gap:8px;align-items:center;text-transform:none;font-size:15px;color:var(--ink);font-weight:400;margin:8px 0 0"><input type="checkbox" id="luNone" style="width:auto" ${d.none?"checked":""}> No lunch taken</label>
    <div class="grid2" id="luTimes" style="display:${d.none?"none":"grid"}"><div><label>Lunch start</label><input id="luS" type="time" value="${esc(d.start||"")}"></div><div><label>Lunch finish</label><input id="luF" type="time" value="${esc(d.finish||"")}"></div></div>
    <div class="mute" style="font-size:12px;margin-top:4px">${L ? "Already set for this day – changing it updates the whole day." : "Usual times filled in – change them if lunch was different."}</div></div>`;
}
function readLunch(){ const none = $("#luNone").checked; return {none, start: none ? "" : $("#luS").value, finish: none ? "" : $("#luF").value}; }
function bindLunch(onChange){
  $("#luNone").onchange = () => { $("#luTimes").style.display = $("#luNone").checked ? "none" : "grid"; onChange && onChange(); };
  ["luS","luF"].forEach(id => $("#"+id).oninput = () => onChange && onChange());
}
async function saveLunch(name, date, L){
  const cur = lunchFor(name, date);
  if(!L.none && (!L.start || !L.finish)) return;                     // nothing usable entered
  if(cur && !!cur.none===!!L.none && (cur.start||"")===(L.start||"") && (cur.finish||"")===(L.finish||"")) return;
  await call("setLunch", {name, date, none:L.none, start:L.start, finish:L.finish});
  S.lunches = (S.lunches||[]).filter(x => !(x.name===name && x.date===date)).concat([{name, date, none:L.none, start:L.start, finish:L.finish}]);
}
function editLunch(name, date){
  openModal(`<h3>Lunch – ${esc(name)}</h3><div class="mute">${fmtD(date)}</div>${lunchHTML(name, date)}
    <div class="actions">${lunchFor(name,date)?`<button class="danger" id="luClr" style="margin-right:auto">Clear</button>`:""}<button id="mCancel">Cancel</button><button class="pri" id="luSave">Save</button></div>`);
  bindLunch();
  $("#mCancel").onclick = closeModal;
  if($("#luClr")) $("#luClr").onclick = async () => { try{ await call("setLunch", {name, date, clear:true}); S.lunches = (S.lunches||[]).filter(x => !(x.name===name && x.date===date)); closeModal(); render(true); }catch(e){ writeErr(e); } };
  $("#luSave").onclick = async () => {
    const L = readLunch(); if(!L.none && (!L.start || !L.finish)){ toast("Enter lunch start and finish, or tick No lunch taken."); return; }
    try{ await saveLunch(name, date, L); closeModal(); render(true); toast("Lunch saved"); }catch(e){ writeErr(e); }
  };
}

/* ---------- Documents on jobs (invoices, delivery dockets, quotes…) ---------- */
S.docs = {};
async function loadDocs(jobId, force){
  if(S.docs[jobId] && !force) return;
  try { S.docs[jobId] = await call("docs", {jobId}) || []; } catch(e){ S.docs[jobId] = S.docs[jobId] || []; console.error(e); }
  if(S.jobId===jobId) renderDocs(jobId);
}
function docsHTML(j){
  return `<h2><span>Documents${S.docs[j.id]?` · ${S.docs[j.id].length}`:""}</span>
    <label class="ghost" style="margin:0;color:var(--acc);font-weight:600;font-size:15px;text-transform:none;letter-spacing:0;cursor:pointer">+ Add document<input type="file" id="dcIn" accept=".pdf,image/*,.csv,.xlsx,.xls,.doc,.docx,.txt" multiple style="display:none"></label></h2>
    <div class="card" id="dcBox" style="padding:2px 14px"></div>`;
}
const docIcon = m => /pdf/.test(m) ? "📄" : /image/.test(m) ? "🖼️" : /sheet|excel|csv/.test(m) ? "📊" : "📎";
const kb = n => n > 1048576 ? (n/1048576).toFixed(1)+" MB" : Math.max(1, Math.round(n/1024))+" KB";
function renderDocs(jobId){
  const box = $("#dcBox"); if(!box) return;
  const list = S.docs[jobId];
  const h2 = box.previousElementSibling && box.previousElementSibling.querySelector("span");
  if(h2) h2.textContent = "Documents" + (list ? ` · ${list.length}` : "");
  if(list == null){ box.innerHTML = `<div class="mute" style="padding:10px 0">Loading…</div>`; return; }
  box.innerHTML = (S.dUpload && S.dUpload.jobId===jobId ? `<div class="mute" style="padding:8px 0">Uploading ${S.dUpload.done+1} of ${S.dUpload.total}…</div>` : "") +
    (list.length ? list.map((d,i)=>`<div class="list-item" data-dc="${i}"><div style="font-size:22px">${docIcon(d.mime)}</div><div class="grow"><div>${esc(d.label||d.name)}</div>
      <div class="mute">${d.label?esc(d.name)+" · ":""}${esc(d.by)} · ${fmtD(d.date)} · ${kb(d.size)}</div></div></div>`).join("")
      : `<div class="mute" style="padding:10px 0">No documents yet. Add wholesaler invoices, delivery dockets or quotes (PDF or photo).</div>`);
  box.querySelectorAll("[data-dc]").forEach(el => el.onclick = () => viewDoc(jobId, list[Number(el.dataset.dc)]));
}
const fileB64 = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(f); });
async function uploadDocs(job, files){
  files = [...files]; if(!files.length) return;
  const big = files.find(f => f.size > 20*1024*1024); if(big){ toast(`${big.name} is too big (over 20 MB).`); return; }
  S.dUpload = {jobId:job.id, done:0, total:files.length}; renderDocs(job.id);
  let ok = 0;
  for(const f of files){
    try {
      const d = await call("uploadDoc", {jobId:job.id, jobNo:job.jobNo, customer:job.customer, name:f.name, mime:f.type||"", data: await fileB64(f), date:today()});
      (S.docs[job.id] = S.docs[job.id] || []).push(d); ok++;
    } catch(e){ console.error(e); toast(e && e.message ? e.message : "A document couldn't be uploaded."); }
    S.dUpload.done++; renderDocs(job.id);
  }
  S.dUpload = null; renderDocs(job.id);
  if(ok) toast(`${ok} document${ok===1?"":"s"} added`);
}
function viewDoc(jobId, d){
  const canDel = S.isAdmin || d.by===S.me.name;
  openModal(`<h3>${docIcon(d.mime)} ${esc(d.label||d.name)}</h3><div class="mute">${esc(d.name)} · ${esc(d.by)} · ${fmtD(d.date)} · ${kb(d.size)}</div>
    <label>Label</label><input id="dcLab" value="${esc(d.label||"")}" placeholder="e.g. L&H invoice – switchboard gear">
    <div class="actions">${canDel?`<button class="danger" id="dcDel" style="margin-right:auto">Delete</button>`:""}<button id="dcOpen">Open</button><button class="pri" id="dcSave">Save</button></div>
    <div class="mute" id="dcMsg"></div>`);
  $("#dcSave").onclick = async () => { try{ await call("labelDoc", {id:d.id, label:$("#dcLab").value.trim()}); d.label = $("#dcLab").value.trim(); closeModal(); renderDocs(jobId); }catch(e){ writeErr(e); } };
  $("#dcOpen").onclick = async e => {
    try {
      const r = await busy(e.currentTarget, "Opening…", () => call("doc", {id:d.id}));
      const bin = atob(r.data), u8 = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([u8], {type:r.mime||d.mime||"application/octet-stream"}));
      const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener"; if(!/pdf|image/.test(r.mime||"")) a.download = r.name || d.name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 120000);
    } catch(err){ writeErr(err); }
  };
  if(canDel) $("#dcDel").onclick = async () => {
    if(!(await confirmBox("Delete this document? It goes to the Drive bin."))) return;
    try{ await call("deleteDoc", {id:d.id}); S.docs[jobId] = (S.docs[jobId]||[]).filter(x=>x.id!==d.id); renderDocs(jobId); toast("Deleted"); }catch(e){ writeErr(e); }
  };
}

async function reviewUnmatched(){
  openModal(`<h3>Unmatched order lines</h3><div class="mute">Loading…</div>`);
  let list; try { list = await call("unmatched"); } catch(e){ closeModal(); writeErr(e); return; }
  const groups = {}; list.forEach(l => { const k = l.supplier+" · "+(l.ref||"(no order number)"); (groups[k] = groups[k] || []).push(l); });
  const keys = Object.keys(groups).sort((a,b) => (groups[b][0].date||"").localeCompare(groups[a][0].date||""));
  const open = S.jobs.filter(j=>j.status!=="complete").sort((a,b)=>String(b.jobNo).localeCompare(String(a.jobNo),undefined,{numeric:true}));
  const jobOpts = `<option value="">Add to job…</option>` + open.map(j=>`<option value="${esc(j.id)}">#${esc(j.jobNo)} · ${esc(j.customer)}</option>`).join("");
  openModal(`<h3>Unmatched order lines · ${list.length}</h3>
    <div class="mute">Lines whose order number isn't a job number (e.g. STOCK, a van rego, a name). Add a whole order to a job, or dismiss it.</div>
    ${keys.length ? keys.slice(0,60).map((k,gi)=>`<div class="card" style="margin-top:10px"><div><b>${esc(k)}</b> <span class="mute">${fmtD(groups[k][0].date)}</span></div>
      ${groups[k].slice(0,8).map(l=>`<div class="mute" style="font-size:13px">${l.qty}${l.u?" "+esc(l.u):""} × ${esc(l.d)}</div>`).join("")}${groups[k].length>8?`<div class="mute" style="font-size:13px">…and ${groups[k].length-8} more</div>`:""}
      <div class="row" style="margin-top:8px"><select data-ug="${gi}" class="grow">${jobOpts}</select><button class="danger" data-ud="${gi}">Dismiss</button></div></div>`).join("")
      : `<div class="empty">Nothing unmatched 🎉</div>`}
    ${keys.length>60?`<div class="mute">Showing the 60 newest orders.</div>`:""}
    <div class="actions"><button class="pri" id="mCancel">Done</button></div>`);
  $("#mCancel").onclick = () => { closeModal(); if(S.view==="settings") viewSettings(); };

/* ---------- Weekly hours ---------- */
function weekStart(d){ const x = parseD(d); const dow = (x.getDay()+6)%7; return addDays(d, -dow); } // Monday
function weekData(start){
  const days = Array.from({length:7}, (_,i)=>addDays(start,i));
  const all = (S.settings.workers||[]).map(w=>w.name);
  const names = S.isAdmin ? all : all.filter(n => n===S.me.name);
  const ord = Number(S.settings.ordinaryHours)||38;
  const rows = names.map(name => {
    const perDay = days.map(d => tsRows(name, d).reduce((s,r)=>s+netHrs(r.e),0));
    const oc = days.map(d => isOnCall(name, d));
    const total = perDay.reduce((a,b)=>a+b,0);
    return {name, perDay, oc, total, ot: Math.max(0, total-ord)};
  });
  return {days, rows, ord};
}

function modeChips(){ return `<div class="chips">${[["day","Day"],["week","Week"]].map(([v,l])=>`<button data-mode="${v}" class="${(S.ts.mode||"day")===v?"on":""}">${l}</button>`).join("")}</div>`; }
function bindModeChips(){ document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { S.ts.mode = b.dataset.mode; render(true); }); }

function weekPDF(start){
  const jsPDF = needPDF(); if(!jsPDF) return null;
  const {days, rows, ord} = weekData(start);
  const doc = new jsPDF({orientation:"landscape", unit:"mm", format:"a4"});
  const X=12, W=273, D=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  let y = 16;
  doc.setFont("helvetica","bold"); doc.setFontSize(15); doc.text("Weekly hours", X, y);
  doc.setFont("helvetica","normal"); doc.setFontSize(11);
  doc.text(`${S.settings.company||""}   ·   Week ${dayName(start).slice(0,3)} ${fmtDAU(start)} – ${dayName(days[6]).slice(0,3)} ${fmtDAU(days[6])}   ·   Ordinary hours ${ord}/week`, X, y+7);
  y += 13;
  const cols = [["Name",55]].concat(days.map((d,i)=>[`${D[i]} ${fmtDAU(d).slice(0,5)}`,24])).concat([["Total",25],["Overtime",25]]);
  const xs=[]; cols.reduce((x,c,i)=>(xs[i]=x,x+c[1]),X);
  const rh = 11;
  const rowLine = (cells, bold, fill) => {
    if(fill){ doc.setFillColor(235,238,235); doc.rect(X,y,W,rh,"F"); }
    doc.setLineWidth(0.25); doc.rect(X,y,W,rh); xs.forEach((x,i)=>{ if(i) doc.line(x,y,x,y+rh); });
    cells.forEach((c,i)=>{ if(c==null||c==="") return; const lines=String(c).split("\n");
      doc.setFont("helvetica", bold||i===0?"bold":"normal"); doc.setFontSize(lines.length>1?8.5:10);
      lines.forEach((t,k)=>{ if(i===0) doc.text(fitText(doc,t,cols[i][1]-3), xs[i]+2, y+(lines.length>1?4.5+k*4:7)); else doc.text(t, xs[i]+cols[i][1]/2, y+(lines.length>1?4.5+k*4:7), {align:"center"}); }); });
    y += rh;
  };
  rowLine(cols.map(c=>c[0]), true, true);
  rows.forEach(r => rowLine([r.name].concat(r.perDay.map((h,i)=>[h?hrs(h):"", r.oc[i]?"ON CALL":""].filter(Boolean).join("\n"))).concat([hrs(r.total), r.ot?hrs(r.ot):""])));
  const dayTot = days.map((_,i)=>rows.reduce((s,r)=>s+r.perDay[i],0));
  rowLine(["Total"].concat(dayTot.map(h=>h?hrs(h):"")).concat([hrs(rows.reduce((s,r)=>s+r.total,0)), (rows.some(r=>r.ot)?hrs(rows.reduce((s,r)=>s+r.ot,0)):"")]), true, true);
  // detail per person
  y += 8;
  const newPage = () => { doc.addPage(); y = 16; };
  rows.forEach(r => {
    const entries = days.flatMap(d => tsRows(r.name, d).map(x => ({d, ...x})));
    const ocDays = days.filter((d,i)=>r.oc[i]);
    if(!entries.length && !ocDays.length) return;
    if(y > 170) newPage();
    doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.text(`${r.name} – ${hrs(r.total)} h${r.ot?` (${hrs(r.ot)} overtime)`:""}${ocDays.length?`  ·  On call: ${ocDays.map(d=>dayName(d).slice(0,3)+" "+fmtDAU(d).slice(0,5)).join(", ")}`:""}`, X, y); y += 2;
    doc.setFont("helvetica","normal"); doc.setFontSize(9);
    entries.forEach(({d, j, e}) => {
      if(y > 196) newPage();
      y += 5;
      doc.text(`${dayName(d).slice(0,3)} ${fmtDAU(d).slice(0,5)}`, X, y);
      doc.text(fitText(doc, `${j.jobNo?"#"+j.jobNo+"  ":""}${j.customer||""}`, 70), X+22, y);
      doc.text(fitText(doc, e.desc||"", 110), X+95, y);
      doc.text(`${e.start||""}–${e.finish||""}${lunchMinFor(e)?`  (lunch ${lunchMinFor(e)}m)`:""}`, X+208, y);
      doc.text(hrs(netHrs(e))+" h", X+W, y, {align:"right"});
    });
    y += 8;
  });
  return {doc, filename:`Weekly hours ${start}.pdf`};
}

async function shrinkImage(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const draw = (max, q) => { const sc = Math.min(1, max/Math.max(img.width, img.height)); const c = document.createElement("canvas");
      c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL("image/jpeg", q).split(",")[1]; };
    return {full: draw(1600, 0.8), thumb: draw(240, 0.7)};
  } finally { URL.revokeObjectURL(url); }
}
async function uploadPhotos(job, files){
  files = [...files].filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|heic|heif|webp)$/i.test(f.name));
  if(!files.length) return;
  S.upload = {jobId:job.id, done:0, total:files.length}; renderPhotos(job.id);
  let ok = 0;
  for(const f of files){
    try {
      const {full, thumb} = await shrinkImage(f);
      const p = await call("uploadPhoto", {jobId:job.id, jobNo:job.jobNo, customer:job.customer, full, thumb, date:today()});
      (S.photos[job.id] = S.photos[job.id] || []).push(p); ok++;
    } catch(e){ console.error(e); toast(e && e.message ? e.message : "A photo couldn't be uploaded."); }
    S.upload.done++; renderPhotos(job.id);
  }
  S.upload = null; renderPhotos(job.id);
  if(ok) toast(`${ok} photo${ok===1?"":"s"} added`);
}

const imgSize = dataUri => new Promise(res => { const i = new Image(); i.onload = () => res({w:i.naturalWidth, h:i.naturalHeight}); i.onerror = () => res(null); i.src = dataUri; });
async function fetchJobPhotos(j, onProg){

function addPhotoPages(doc, j, photos){
  const X=14, W=182, top=24, cellW=89, cellH=118, gap=4, capH=10;
  photos.forEach((p, i) => {
    const k = i % 4;
    if(k===0){
      doc.addPage();
      doc.setFont("helvetica","bold"); doc.setFontSize(12);
      doc.text(`Photos – Job ${j.jobNo}  ${j.customer}`, X, 17);
      doc.setFont("helvetica","normal"); doc.setFontSize(9);
      doc.text(`Page ${Math.floor(i/4)+1} of ${Math.ceil(photos.length/4)}`, X+W, 17, {align:"right"});
      doc.setFontSize(9); doc.text("Jobsheet.doc", X, 284); doc.text("Version 4", X+W, 281, {align:"right"}); doc.text("Jun 2020", X+W, 285, {align:"right"});
    }
    const cx = X + (k%2)*(cellW+gap), cy = top + Math.floor(k/2)*(cellH+gap);
    const maxW = cellW, maxH = cellH - capH;
    const sc = Math.min(maxW/p.w, maxH/p.h), w = p.w*sc, h = p.h*sc;
    doc.addImage(p.uri, "JPEG", cx + (maxW-w)/2, cy + (maxH-h)/2, w, h);
    doc.setLineWidth(0.2); doc.setDrawColor(190); doc.rect(cx, cy, cellW, maxH); doc.setDrawColor(0);
    doc.setFont("helvetica","bold"); doc.setFontSize(9);
    doc.text(fitText(doc, p.caption || `Photo ${i+1}`, cellW-2), cx, cy+maxH+4.5);
    doc.setFont("helvetica","normal"); doc.setFontSize(8);
    doc.text(fitText(doc, `${p.by||""}${p.date?" · "+fmtDAU(p.date):""}`, cellW-2), cx, cy+maxH+8.5);
  });
}

/* job numbers already used (job cards + typed-in hours), newest first, for the job number suggestions */
function knownJobs(){
  const m = new Map();
  const add = (no, cust, d) => { no = String(no||"").trim(); if(!no) return; const o = m.get(no); if(!o || (d||"") > o.d) m.set(no, {no, cust: cust || (o && o.cust) || "", d: d||""}); };
  (S.jobs||[]).filter(j=>j.status!=="complete").forEach(j => add(j.jobNo, j.customer, lastDate(j)));
  (S.hours||[]).forEach(h => add(h.jobNo, h.customer, h.date));
  return [...m.values()].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,60);
}
function tsRows(worker, date){
  const rows = [];
  for(const j of S.jobs) for(const e of (j.labour||[])) if(e.worker===worker && e.date===date) rows.push({j, e});
  for(const h of (S.hours||[])) if(h.worker===worker && h.date===date) rows.push({j:{id:"", jobNo:h.jobNo, customer:h.customer, desc:""}, e:h, free:true});
  rows.sort((a,b)=>(a.e.start||"").localeCompare(b.e.start||""));
  return rows;
}
function tsLines(worker, date){
  const rows = tsRows(worker, date);
  const lines = rows.map(({j,e}) => ({jobNo:j.jobNo, cust:j.customer, desc:e.desc||j.desc||"", start:e.start, finish:e.finish, rego:e.rego||"", wip:e.wip?"WIP":"", hours:hrs(grossMin(e)/60)}));
  const lunch = rows.reduce((s,r)=>s+lunchMinFor(r.e),0);
  const total = rows.reduce((s,r)=>s+netHrs(r.e),0);
  const LB = lunchFor(worker, date);
  if(isOnCall(worker, date)) lines.push({jobNo:"", cust:"", desc:"ON CALL", start:"", finish:"", rego:"", wip:"", hours:"", bold:true});
  if(LB && LB.none) lines.push({jobNo:"", cust:"", desc:"NO LUNCH TAKEN", start:"", finish:"", rego:"", wip:"", hours:"", bold:true});
  else if(LB && LB.start) lines.push({jobNo:"", cust:"", desc:"LUNCH BREAK", start:LB.start, finish:LB.finish, rego:"", wip:"", hours: lunch ? "-"+hrs(lunch/60) : ""});
  else if(lunch) lines.push({jobNo:"", cust:"", desc:`LUNCH BREAK (${lunch} min)`, start:"", finish:"", rego:"", wip:"", hours:"-"+hrs(lunch/60)});
  if(rows.length) lines.push({jobNo:"", cust:"", desc:"TOTAL HOURS", start:"", finish:"", rego:"", wip:"", hours:hrs(total), bold:true});
  return {rows, lines, total, lunch};
}
const TS_COLS = [["JOB<br>NUMBER",190,"jobNo"],["CUSTOMER NAME",320,"cust"],["JOB DESCRIPTION",590,"desc"],["START",160,"start"],["FINISH",160,"finish"],["REGO",125,"rego"],["WIP",135,"wip"],["HOURS",250,"hours"]];

/* ---------- PDF ---------- */
/* ---------- PDF actions: download, email, save to Drive ---------- */
function downloadPDF(r){
  if(!r) return;
  const url = URL.createObjectURL(r.doc.output("blob"));
  const a = document.createElement("a"); a.href = url; a.download = r.filename; a.target = "_blank"; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 60000);
}
async function busy(btn, label, fn){
  const old = btn.textContent; btn.disabled = true; btn.textContent = label;
  try { return await fn(); } finally { btn.disabled = false; btn.textContent = old; }
}
async function emailPDF(btn, kind, r, meta){
  if(!r) return;
  const pdf = r.doc.output("datauristring").split(",")[1];
  try { const res = await busy(btn, "Sending…", () => call("email", Object.assign({kind, filename:r.filename, pdf}, meta))); toast("Emailed to " + res.to); }
  catch(e){ writeErr(e); }
}
async function drivePDF(btn, r, sub){
  if(!r) return;
  const pdf = r.doc.output("datauristring").split(",")[1];
  try {
    const res = await busy(btn, "Saving…", () => call("saveToDrive", {filename:r.filename, pdf, sub}));
    openModal(`<h3>Saved to Google Drive</h3><p>${esc(r.filename)} is in <b>Timesheets${sub?" → "+esc(sub):""}</b> in Google Drive.</p><p><a href="${esc(res.url)}" target="_blank" rel="noopener">Open the PDF</a></p><div class="actions"><button class="pri" id="mCancel">Done</button></div>`);
    $("#mCancel").onclick = closeModal;
  } catch(e){ writeErr(e); }
}
function pdfButtons(prefix){
  return `<div class="row" style="gap:6px;flex-wrap:wrap;margin-top:10px">
    <button class="pri" id="${prefix}Email" style="flex:1 1 100%">Email to admin</button>
    <button id="${prefix}Dl" style="flex:1">Download</button><button id="${prefix}Drive" style="flex:1">Save to Drive</button></div>`;
}

function needPDF(){ if(!window.jspdf){ toast("PDF tool still loading – try again in a second."); return null; } return window.jspdf.jsPDF; }
function fitText(doc, s, w){ s=String(s||""); if(doc.getTextWidth(s)<=w) return s; while(s.length && doc.getTextWidth(s+"…")>w) s=s.slice(0,-1); return s+"…"; }

function timesheetPDF(worker, date){
  const jsPDF = needPDF(); if(!jsPDF) return;
  const {lines} = tsLines(worker, date);
  const doc = new jsPDF({orientation:"landscape", unit:"mm", format:"a4"});
  const X0 = 12, W = 273, tw = TS_COLS.reduce((s,c)=>s+c[1],0);
  const cw = TS_COLS.map(c=>c[1]/tw*W);
  const cx = []; cw.reduce((x,w,i)=>(cx[i]=x, x+w), X0);
  const rowH = 12.5, hdrH = 12, thH = 15;
  const pages = Math.max(1, Math.ceil(lines.length/TS_ROWS));
  for(let p=0;p<pages;p++){
    if(p) doc.addPage();
    let y = 14; doc.setLineWidth(0.3);
    // column titles (top)
    doc.rect(X0, y, W, thH); cw.forEach((w,i)=>{ if(i) doc.line(cx[i], y, cx[i], y+thH); });
    doc.setFont("times","normal"); doc.setFontSize(12);
    TS_COLS.forEach((c,i)=>{ const t=c[0].split("<br>"); const mid=cx[i]+cw[i]/2; if(t.length===2){ doc.text(t[0], mid, y+6, {align:"center"}); doc.text(t[1], mid, y+11.5, {align:"center"}); } else doc.text(t[0], mid, y+thH/2+1.8, {align:"center"}); });
    y += thH;
    // data rows
    for(let r=0;r<TS_ROWS;r++){
      doc.rect(X0, y, W, rowH); cw.forEach((w,i)=>{ if(i) doc.line(cx[i], y, cx[i], y+rowH); });
      const l = lines[p*TS_ROWS + r];
      if(l){
        doc.setFont("times", l.bold?"bold":"normal"); doc.setFontSize(12);
        TS_COLS.forEach((c,i)=>{ const v=l[c[2]]; if(!v) return; const centre=["start","finish","wip","hours","jobNo"].includes(c[2]);
          let fs=12; doc.setFontSize(fs); while(doc.getTextWidth(String(v))>cw[i]-3 && fs>8){ fs-=0.5; doc.setFontSize(fs); }
          const s=fitText(doc, v, cw[i]-3); centre ? doc.text(s, cx[i]+cw[i]/2, y+rowH/2+1.6, {align:"center"}) : doc.text(s, cx[i]+2, y+rowH/2+1.6); });
      }
      y += rowH;
    }
    // NAME / DAY / DATE row (bottom)
    doc.rect(X0, y, W, hdrH); cw.forEach((w,i)=>{ if(i) doc.line(cx[i], y, cx[i], y+hdrH); });
    const by = y + hdrH/2 + 1.6; doc.setFontSize(12);
    doc.setFont("times","bold"); doc.text("NAME:", cx[0]+2, by);
    doc.setFont("times","normal"); doc.text(fitText(doc, worker, cw[1]-4), cx[1]+2, by);
    doc.setFont("times","bold"); doc.text("DAY:", cx[2]+2, by);
    doc.setFont("times","normal"); doc.text(dayName(date), cx[2]+15, by);
    doc.setFont("times","bold"); doc.text("DATE", cx[6]+2, by);
    doc.setFont("times","normal"); doc.text(fmtDAU(date), cx[7]+2, by);
    y += hdrH;
    // footer
    y += 7; doc.setFont("times","bolditalic"); doc.setFontSize(13);
    doc.text("Timesheet", X0, y); doc.text("Ver. 2", X0+W*0.42, y); doc.text("timsh doc:1", X0+W*0.66, y);
    if(pages>1){ doc.setFont("times","normal"); doc.setFontSize(9); doc.text(`Page ${p+1} of ${pages}`, X0+W, y, {align:"right"}); }
  }
  return {doc, filename:`Timesheet ${worker} ${date}.pdf`};
}

/* Job card PDF – matches the paper "Jobsheet.doc  Version 4  Jun 2020" */
function jobCardPDF(j){
  const jsPDF = needPDF(); if(!jsPDF) return;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const X = 14, W = 182, R0 = X + W;
  const dots = (x1, x2, y) => { doc.setLineWidth(0.25); doc.setLineDashPattern([0.3, 1], 0); doc.line(x1, y, x2, y); doc.setLineDashPattern([], 0); };
  const footer = () => {
    doc.setFont("helvetica","normal"); doc.setFontSize(9);
    doc.text("Jobsheet.doc", X, 284);
    doc.text("Version 4", R0, 281, {align:"right"}); doc.text("Jun 2020", R0, 285, {align:"right"});
  };
  const grid = (cols, y, rowsN, hdrH, rowH) => { // draws table frame, returns column x's
    const xs = []; cols.reduce((x,c,i)=>(xs[i]=x, x+c[1]), X);
    doc.setLineWidth(0.35); doc.rect(X, y, W, hdrH + rowsN*rowH);
    xs.forEach((x,i)=>{ if(i) doc.line(x, y, x, y + hdrH + rowsN*rowH); });
    for(let r=0;r<=rowsN;r++) doc.line(X, y+hdrH+r*rowH, R0, y+hdrH+r*rowH);
    doc.setFont("helvetica","normal"); doc.setFontSize(11);
    cols.forEach((c,i)=>{ const mid = xs[i] + c[1]/2; doc.text(c[0], mid, y + hdrH - 2.2, {align:"center"}); });
    return xs;
  };
  const cell = (txt, xs, cols, i, y, rowH, align) => {
    if(txt==null || txt==="") return;
    const w = cols[i][1] - 3, fs0 = doc.getFontSize(); let fs = fs0;
    while(doc.getTextWidth(String(txt)) > w && fs > 6.5){ fs -= 0.5; doc.setFontSize(fs); }   // shrink long cat nos to fit
    const t = fitText(doc, String(txt), w);
    if(align==="c") doc.text(t, xs[i] + cols[i][1]/2, y + rowH - 2.1, {align:"center"});
    else doc.text(t, xs[i] + 1.5, y + rowH - 2.1);
    doc.setFontSize(fs0);
  };

  /* ---- labour lines (long descriptions wrap onto extra rows) ---- */
  const LC = [["Date",18.7],["Start",18.7],["Finish",19.2],["Description",81.1],["Employee",26.4],["Hours",17.9]];
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
  const labLines = [];
  (j.labour||[]).slice().sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).forEach(e=>{
    const d = e.desc ? doc.splitTextToSize(e.desc, LC[3][1]-3) : [""];
    d.forEach((t,k)=> labLines.push(k===0 ? {date:fmtDAU(e.date).replace(/\/(\d\d)(\d\d)$/,"/$2"), start:e.start, finish:e.finish, desc:t, emp:e.worker, hrs:hrs(netHrs(e))} : {desc:t}));
  });
  if(labLines.length) labLines.push({desc:"TOTAL HOURS", hrs:hrs(jobHours(j)), bold:true});

  /* ---- page 1: letterhead + customer box + labour ---- */
  const LH = W * LOGO_AR;
  doc.addImage(LOGO, "JPEG", X, 6, W, LH);
  let y = 6 + LH + 2;
  doc.setLineWidth(0.4); doc.line(X, y, R0, y);
  y += 3; const boxTop = y;
  doc.setFont("helvetica","bold"); doc.setFontSize(10.5);
  doc.text("Customer", X+3, y+6); doc.text("Name:", X+3, y+11);
  dots(X+16, R0-4, y+11.5);
  doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.text(fitText(doc, j.customer + (j.address ? "  –  " + j.address : ""), W-24), X+18, y+10.5);
  doc.setFont("helvetica","bold"); doc.setFontSize(10.5);
  doc.text("Customer Job Number:", X+3, y+19.5); dots(X+45, X+110, y+20);
  doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.text(String(j.jobNo), X+47, y+19);
  doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.text("Labour", X+6, y+27.5);
  doc.setFontSize(10.5); doc.text("Date:", X+118, y+27.5); dots(X+129, R0-4, y+28);
  doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.text(fmtDAU(j.date), X+131, y+27);
  doc.setLineWidth(0.4); doc.rect(X, boxTop, W, 30);
  y = boxTop + 33;
  const L_ROWS = Math.floor((276 - y - 8) / 6.8), ROWH = 6.8;
  let li = 0, first = true;
  do {
    if(!first){ doc.addPage(); doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.text(`Labour (continued) – Job ${j.jobNo}  ${j.customer}`, X, 16); y = 20; }
    const rowsHere = first ? L_ROWS : Math.floor((276 - y - 8)/ROWH);
    const xs = grid(LC, y, rowsHere, 8, ROWH);
    for(let r=0; r<rowsHere && li<labLines.length; r++, li++){
      const l = labLines[li], ry = y + 8 + r*ROWH;
      doc.setFont("helvetica", l.bold ? "bold" : "normal"); doc.setFontSize(9.5);
      cell(l.date, xs, LC, 0, ry, ROWH); cell(l.start, xs, LC, 1, ry, ROWH, "c"); cell(l.finish, xs, LC, 2, ry, ROWH, "c");
      cell(l.desc, xs, LC, 3, ry, ROWH); cell(l.emp, xs, LC, 4, ry, ROWH); cell(l.hrs, xs, LC, 5, ry, ROWH, "c");
    }
    footer(); first = false;
  } while(li < labLines.length);

  /* ---- materials page(s) ---- */
  const MC = [["Date",15.0],["Qty",13.7],["Cat No",30.3],["Description",99.9],["Supplier",23.1]];
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
  const matLines = [];
  (j.materials||[]).slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(m=>{
    const d = doc.splitTextToSize(m.d||"", MC[3][1]-3);
    d.forEach((t,k)=> matLines.push(k===0 ? {date:m.date ? fmtDAU(m.date).slice(0,5) : "", qty:String(m.qty)+(m.u && !/^ea/i.test(m.u)?" "+m.u:""), cat:m.c, desc:t, sup:m.s} : {desc:t}));
  });
  const BOX_H = 60, M_TOP = 24, MROWH = 7;
  const lastRows = Math.floor((276 - BOX_H - M_TOP - 7) / MROWH);   // rows on the page that carries the notes box
  const fullRows = Math.floor((276 - M_TOP - 7) / MROWH);
  let mi = 0;
  for(;;){
    doc.addPage();
    const remaining = matLines.length - mi;
    const isLast = remaining <= lastRows;
    const rowsHere = isLast ? lastRows : fullRows;
    doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.text(mi ? "Materials (continued)" : "Materials", X, M_TOP - 4);
    const xs = grid(MC, M_TOP, rowsHere, 7, MROWH);
    for(let r=0; r<rowsHere && mi<matLines.length; r++, mi++){
      const l = matLines[mi], ry = M_TOP + 7 + r*MROWH;
      doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
      cell(l.date, xs, MC, 0, ry, MROWH, "c"); cell(l.qty, xs, MC, 1, ry, MROWH, "c"); cell(l.cat, xs, MC, 2, ry, MROWH);
      cell(l.desc, xs, MC, 3, ry, MROWH); cell(l.sup, xs, MC, 4, ry, MROWH);
    }
    if(isLast){
      let by = M_TOP + 7 + rowsHere*MROWH;
      doc.setLineWidth(0.35); doc.rect(X, by, W, BOX_H);
      doc.setFont("helvetica","normal"); doc.setFontSize(11);
      doc.text("JIC/LIC", X+4, by+8); doc.rect(X+22, by+3.5, 5, 5);
      if(j.jic){ doc.setLineWidth(0.5); doc.line(X+22.8, by+6, X+24.2, by+7.8); doc.line(X+24.2, by+7.8, X+26.4, by+4.2); doc.setLineWidth(0.35); }
      doc.text("Materials required:", X+4, by+15);
      const mr = doc.splitTextToSize(j.matsReq||"", W-12);
      [by+21.5, by+28].forEach((ly,k)=>{ dots(X+4, R0-4, ly); if(mr[k]) doc.text(k===1 && mr.length>2 ? fitText(doc, mr.slice(1).join(" "), W-12) : mr[k], X+5, ly-1); });
      doc.text("Completed Job Description:", X+4, by+35);
      const cd = doc.splitTextToSize(j.completed||"", W-12);
      [by+41.5, by+48, by+54.5].forEach((ly,k)=>{ dots(X+4, R0-4, ly); if(cd[k]) doc.text(k===2 && cd.length>3 ? fitText(doc, cd.slice(2).join(" "), W-12) : cd[k], X+5, ly-1); });
      footer(); break;
    }
    footer();
  }
  return {doc, filename:`Job sheet ${j.jobNo} ${j.customer}.pdf`};
}

function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  const first = text.split("\n")[0];
  const delim = (first.match(/\t/g)||[]).length > (first.match(/,/g)||[]).length ? "\t" : ",";
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='\\' && text[i+1]==='"' && text[i+2]!==delim && text[i+2]!=="\n" && text[i+2]!=="\r" && text[i+2]!==undefined){ f+='"'; i++; } // backslash-escaped quote, e.g. 19\" rack
      else if(ch==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=ch; }
    else if(ch==='"') q=true;
    else if(ch===delim){ row.push(f); f=""; }
    else if(ch==="\n"){ row.push(f); rows.push(row); row=[]; f=""; }
    else if(ch!=="\r") f+=ch;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}
const FIELDS = [
  ["c","Cat no / part no.",/^(item|stock|part|product|cat(alogue)?)?\s*(code|no\.?|number|#|sku)$|^code$|sku|part\s*n|item\s*c|stock\s*c|product\s*c|cat.*no|^item\s*name$/i],
  ["d","Description",/desc|^name$|product\s*name|title/i],
  ["b","Brand",/brand|manuf|make/i],
  ["u","Unit",/^unit$|uom|unit\s*of|^per$|sell\s*unit/i],
  ["g","Product type",/categ|group|class|dept|family|type/i],
  ["k","Nickname",/nick|alias|short\s*name|our\s*name/i],
  ["p","Price (optional)",/(nett?|trade|your|cost|buy|sell)?\s*price|cost|nett|ex\s*gst/i]];
function guessMap(hdr){
  const map={}; const used=new Set();
  FIELDS.forEach(([k,,re])=>{ const i = hdr.findIndex((h,ix)=>!used.has(ix) && re.test(String(h).trim())); if(i>=0){ map[k]=i; used.add(i); } else map[k]=-1; });
  return map;
}
const ymd = v => { const s=String(v||"").trim(); let m;
  if((m=s.match(/^(\d{4})(\d{2})(\d{2})$/))) return `${m[1]}-${m[2]}-${m[3]}`;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))) return `${m[3].length===2?"20"+m[3]:m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  return ""; };

      <div class="progress" id="fProg" style="display:none"><div></div></div>
      <div class="actions"><button class="pri" id="fGo">Import</button></div>`;

    const getMap = () => { const m={}; document.querySelectorAll("[data-map]").forEach(s=>m[s.dataset.map]=Number(s.value)); return m; };
    const build = () => {

          it.n++; const d = ymd(r[idt]); if(d > it.l) it.l = d;
        });

      }
      const m = getMap(); const g = k => r => m[k]>=0 ? String(r[m[k]]??"").trim() : "";
      const agg = new Map();
      data.forEach(r => {
        const d = g("d")(r); if(!d) return;

        const it = {s:sup, k:g("k")(r) || autoNick(d, c), g:(TYPE_NAMES.includes(g("g")(r)) ? g("g")(r) : autoType(d)), c, d, b:g("b")(r), u:g("u")(r), n:0, l:"", p:Number(g("p")(r).replace(/[^0-9.\-]/g,""))||0};

      $("#fGo").textContent = `Import ${build().length.toLocaleString()} products`;
    };
    document.querySelectorAll("[data-map]").forEach(s=>s.onchange=prev); prev();
    $("#fGo").onclick = async () => {
      const sup = $("#fSup").value.trim();
      if(!sup){ toast("Enter the supplier's name."); return; }
      if(!isOrderHistory && getMap().d<0){ toast("Pick the Description column."); return; }
      const incoming = build();
      if(!isOrderHistory) lsSet(sig, {map:getMap(), sup});
      else lsSet(sig, {sup});
      const keep = $("#fMode").value==="replace" ? S.items.filter(it => it.s!==sup) : S.items.map(clone);
      const mp = new Map(keep.map(it=>[itemKey(it), it]));
      incoming.forEach(it => {
        const o = mp.get(itemKey(it));
        if(o){ for(const k of ["d","b","u"]) if(it[k]) o[k]=it[k]; if(it.k && !o.k) o.k = it.k; if(it.p) o.p=it.p; if(it.n) o.n=it.n; if(it.l) o.l=it.l; if(!o.g || o.g==="Other") o.g=it.g; }
        else mp.set(itemKey(it), it);
      });
      const merged = [...mp.values()];
      $("#fGo").disabled=true; $("#mCancel").disabled=true; $("#fProg").style.display="";
      try { await replaceInventory(merged, p=>{ $("#fProg div").style.width=(p*100)+"%"; }); closeModal(); S.invF={s:sup,g:""}; render(true); toast(`Imported – ${incoming.length.toLocaleString()} products from ${sup}`); }
      catch(err){ $("#fGo").disabled=false; $("#mCancel").disabled=false; writeErr(err); }
    };
    $("#fSup").oninput = () => {};
  };
}

/* ---------- Push notifications (timesheet reminders) ---------- */
const FB_VER = "10.12.2";
function fcmCfg(){ try { return S.settings.fcmConfig ? JSON.parse(S.settings.fcmConfig) : null; } catch(e){ return null; } }
function isStandalone(){ return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true; }
function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1); }
function pushWhyNot(){
  if(window.google && google.script && google.script.run) return "Reminders only work in the app installed from the GitHub link, not the Google link.";
  if(isIOS() && !isStandalone()) return "On iPhone, add the app to your Home Screen first (Share → Add to Home Screen), open it from there, then turn reminders on. Needs iOS 16.4 or newer.";
  if(!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return "This phone or browser can't receive app notifications. On Android use Chrome; on iPhone add the app to the Home Screen.";
  return "";
}
function deviceName(){
  const u = navigator.userAgent;
  const os = /iPhone/.test(u) ? "iPhone" : /iPad/.test(u) ? "iPad" : /Android/.test(u) ? "Android" : /Windows/.test(u) ? "Windows" : /Mac/.test(u) ? "Mac" : "Device";
  const br = /SamsungBrowser/.test(u) ? "Samsung Internet" : /EdgA?\//.test(u) ? "Edge" : /CriOS|Chrome\//.test(u) ? "Chrome" : /Firefox|FxiOS/.test(u) ? "Firefox" : /Safari/.test(u) ? "Safari" : "";
  return os + (br ? " · " + br : "");
}
function loadScript(src){ return new Promise((ok, bad) => { if(document.querySelector(`script[src="${src}"]`)) return ok(); const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>bad({code:"unavailable", message:"Couldn't load the notification tool – check your connection."}); document.head.appendChild(s); }); }
async function fbMessaging(){
  if(!window.firebase || !firebase.messaging){
    await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app-compat.js`);
    await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-messaging-compat.js`);
  }
  if(!firebase.apps.length) firebase.initializeApp(fcmCfg());
  return firebase.messaging();
}
async function getPushToken(){
  const reg = await navigator.serviceWorker.ready;
  const m = await fbMessaging();
  return m.getToken({vapidKey: S.settings.fcmVapid, serviceWorkerRegistration: reg});
}
async function pushEnable(){
  const why = pushWhyNot(); if(why) throw {code:"bad", message:why};
  if(!fcmCfg() || !S.settings.fcmVapid) throw {code:"bad", message:"Your admin hasn't set up reminders yet."};
  const perm = await Notification.requestPermission();
  if(perm !== "granted") throw {code:"bad", message:"Notifications are blocked for this app. Allow them in your phone's settings for this app (or the browser's site settings), then try again."};
  const token = await getPushToken();
  if(!token) throw {code:"bad", message:"Couldn't register this phone – try again."};
  await call("pushToken", {token, device: deviceName(), on: true});
  lsSet("pushToken", token);
}
async function pushDisable(){
  const token = lsGet("pushToken");
  if(token){ try { await call("pushToken", {token, on:false}); } catch(e){} try { (await fbMessaging()).deleteToken(); } catch(e){} }
  lsSet("pushToken", null);
}
/* on every start: keep this phone's token current (Firebase can rotate it) */
async function pushRefresh(){
  try {
    const old = lsGet("pushToken");
    if(!old || pushWhyNot() || !fcmCfg() || Notification.permission !== "granted") return;
    const token = await getPushToken();
    if(token && token !== old){ await call("pushToken", {token, device: deviceName(), on:true}); await call("pushToken", {token: old, on:false}); lsSet("pushToken", token); }
  } catch(e){ console.warn("push refresh", e); }
}
function pushOnHere(){ return !!lsGet("pushToken") && ("Notification" in window) && Notification.permission === "granted"; }
