      <label>On these days</label>
      <div class="row" style="gap:4px;flex-wrap:wrap">${RDAYS.map((d,i)=>`<label class="chip" style="display:flex;gap:4px;align-items:center;margin:0;text-transform:none;font-size:14px;color:var(--ink);font-weight:400;border:1px solid var(--line,#ddd);border-radius:16px;padding:4px 10px"><input type="checkbox" data-day="${i+1}" style="width:auto;margin:0" ${days.includes(i+1)?"checked":""}>${d}</label>`).join("")}</div>
      <label>Who gets reminded</label>
      <select id="rRule"><option value="sent" ${s.reminderRule!=="hours"?"selected":""}>Anyone who hasn't emailed today's timesheet</option><option value="hours" ${s.reminderRule==="hours"?"selected":""}>Anyone with no hours logged today</option></select>
      <label ${lab}><input type="checkbox" id="rSum" style="width:auto" ${s.summaryOn?"checked":""}> Send admins a list of who's missing at</label>
      <input type="time" id="rSumT" value="${esc(s.summaryTime||"17:30")}">
      <div class="mute" style="margin-top:6px">Tap <b>Save settings</b> at the bottom to apply. Reminders arrive within 15 minutes of the time. Each person turns them on for their own phone in Settings.</div>
      ${last?`<div class="mute" style="margin-top:6px">Last sent ${esc(last.at)}${last.reminders?`: reminded ${esc(last.reminders.sent.join(", ")||"nobody")}`:""}${last.summary?` · summary listed ${esc(last.summary.missing.join(", ")||"nobody")}`:""}.</div>`:""}
      ${p.ready?`<button id="pNow" style="width:100%;margin-top:8px">Send reminders now (test)</button>`:""}
    </div>`;
}
function readReminderSettings(){
  if(!$("#rOn")) return {};
  return { reminderOn: $("#rOn").checked, reminderTime: $("#rTime").value || "17:00",
    reminderDays: [...document.querySelectorAll("[data-day]")].filter(x=>x.checked).map(x=>x.dataset.day).join(","),
    reminderRule: $("#rRule").value, summaryOn: $("#rSum").checked, summaryTime: $("#rSumT").value || "17:30" };
}
function bindReminderCard(){
  if($("#pSetup")) $("#pSetup").onclick = pushSetupDialog;
  if($("#pNow")) $("#pNow").onclick = async e => {
    try { const r = await busy(e.currentTarget, "Sending…", () => call("pushRemindNow"));
      toast(r.missing.length ? `Not done: ${r.missing.join(", ")}. Reminded: ${r.sent.join(", ") || "nobody (no phones signed up)"}` : "Everyone's timesheet is done – nobody to remind");
    } catch(err){ writeErr(err); } };
}
function pushSetupDialog(){
  const cfg = fcmCfg();
  openModal(`<h3>Set up Firebase</h3>
    <p class="mute">Copy these from your Firebase project – Part A3 of the guide shows where each one is.</p>
    <label>1. Web app config (the whole <i>firebaseConfig</i> block)</label>
    <textarea id="fbCfg" rows="6" placeholder='const firebaseConfig = { apiKey: "…", projectId: "…", messagingSenderId: "…", appId: "…" };'>${cfg?esc(JSON.stringify(cfg,null,1)):""}</textarea>
    <label>2. Web Push key (Cloud Messaging → Web Push certificates → Key pair)</label>
    <input id="fbVap" value="${esc(S.settings.fcmVapid||"")}" autocapitalize="off" autocomplete="off">
    <label>3. Service account key (.json file)</label>
    ${S.push && S.push.hasKey ? `<div class="mute">A key is saved ✓ – only choose a file to replace it.</div>` : ""}
    <input type="file" id="fbKey" accept=".json,application/json">
    <div class="mute" style="margin-top:6px">The key file is stored privately in your Apps Script, not in the sheet or on phones. Delete the downloaded copy afterwards.</div>
    <div class="actions"><button id="mCancel">Cancel</button><button class="pri" id="fbSave">Save &amp; test</button></div>`);
  $("#mCancel").onclick = closeModal;
  $("#fbSave").onclick = async e => {
    const btn = e.currentTarget, f = $("#fbKey").files[0];
    const p = { config: $("#fbCfg").value, vapid: $("#fbVap").value, key: f ? await f.text() : "" };
    try { S.push = await busy(btn, "Checking…", () => call("pushSetup", p)); closeModal(); toast("Firebase connected ✓"); await loadAll(true); viewSettings(); }
    catch(err){ writeErr(err); }
  };
}
/* tapping a notification opens the timesheet */
function goFromUrl(){
  const q = new URLSearchParams(location.search);
  if(q.get("go")==="timesheet"){ S.view="timesheet"; S.jobId=null; S.ts.worker = S.me.name; S.ts.date = today(); history.replaceState(null, "", location.pathname); }
}
if("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", e => {
  if(e.data && e.data.go==="timesheet" && S.me){ S.view="timesheet"; S.jobId=null; S.ts.worker=S.me.name; S.ts.date=today(); render(true); }
});

/* ---------- SETTINGS ---------- */
function viewSettings(){
  $("#title").textContent = "Settings";
  const s = S.settings;
  const me = `<div class="card"><div class="row"><div class="grow">Signed in as <b>${esc(S.me && S.me.name)}</b>${S.isAdmin?` <span class="pill">Admin</span>`:""}</div><button id="sPin" class="ghost">Change PIN</button><button id="sOut">Sign out</button></div></div>`;
  if(!S.isAdmin){
    $("#main").innerHTML = me + `<div class="card"><div class="mute">Timesheets are emailed to</div><div><b>${esc(s.adminEmail||"(not set)")}</b></div><p class="mute">Only an admin can change settings, workers and PINs.</p></div>` + verLine() + phoneCardHTML();
    $("#sOut").onclick = signOut; $("#sPin").onclick = () => choosePin(false); bindPhoneCard(); return;
  }
  $("#main").innerHTML = me + verLine() + `
    ${phoneCardHTML()}
    ${reminderCardHTML()}
    ${ordersCardHTML()}
    <h2><span>Email</span></h2>
    <div class="card">
      <label style="margin-top:0">Send timesheets to</label><input id="sAdm" type="email" value="${esc(s.adminEmail)}">
      <label>Send job sheets to</label><input id="sJob" type="email" value="${esc(s.jobEmail)}" placeholder="Same as timesheets">
      <label style="display:flex;gap:8px;align-items:center;text-transform:none;font-size:15px;color:var(--ink);font-weight:400"><input type="checkbox" id="sCc" style="width:auto" ${s.ccWorker!==false?"checked":""}> Send the worker a copy (to their work email)</label>
      <label>Send from address (optional)</label><input id="sFrom" type="email" value="${esc(s.fromAlias)}" placeholder="e.g. timesheets@ your domain">
      <div class="mute" style="margin-top:6px">Leave blank to send from the Google account that runs this app. A different address only works once it has been added to that Gmail account as a "Send mail as" address. Replies always go to the worker's own email.</div>
    </div>
    <h2><span>Job settings</span></h2>
    <div class="card"><label style="margin-top:0">Business name</label><input id="sCo" value="${esc(s.company)}">
    <label>App access code</label><input id="sAc" value="${esc(s.accessCode||"jones1898")}" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="mute">Typed once on each phone before the list of names shows. If you change it, everyone types the new one next time they open the app.</div>
    <div class="grid2"><div><label>Usual lunch start</label><input id="sLuS" type="time" value="${esc(s.lunchStart||"12:00")}"></div><div><label>Usual lunch finish</label><input id="sLuF" type="time" value="${esc(s.lunchFinish||"12:30")}"></div></div>
    <label>Ordinary hours per week (overtime after this)</label><input id="sOrd" type="number" inputmode="decimal" min="0" step="0.5" value="${esc(s.ordinaryHours||38)}">
    <div class="mute" style="margin-top:6px">Filled in for each person's day – they change it if lunch was different, or tick "No lunch taken".</div>
    <label>Usual supplier</label><input id="sSup" value="${esc(s.supplier||"")}" placeholder="Pre-selected when adding materials">
    <label style="display:flex;gap:8px;align-items:center;text-transform:none;font-size:15px;color:var(--ink);font-weight:400"><input type="checkbox" id="sPr" style="width:auto" ${s.showPrices?"checked":""}> Show prices</label>
    <label style="display:flex;gap:8px;align-items:center;text-transform:none;font-size:15px;color:var(--ink);font-weight:400"><input type="checkbox" id="sTso" style="width:auto" ${s.tsOnly?"checked":""}> Timesheets only for workers</label>
    <div class="mute">Workers (not admins) only see Timesheet and Settings, and type in their own hours by job number. Admins still see jobs, products and everyone's timesheets.</div></div>
    <h2><span>Workers</span><button class="ghost" id="addW">+ Add</button></h2>
    ${(s.workers||[]).map((w,i)=>`<div class="card" data-w="${i}">
      <div class="grid2"><div><label style="margin-top:0">Name</label><input value="${esc(w.name)}" data-f="name"></div><div><label style="margin-top:0">Vehicle rego</label><input value="${esc(w.rego)}" data-f="rego" style="text-transform:uppercase"></div></div>
      <label>Work email</label><input type="email" value="${esc(w.email)}" data-f="email" placeholder="Replies and copies go here">
      <div class="grid2"><div><label>PIN</label><input value="${esc(w.pin)}" data-f="pin" inputmode="numeric"></div>
      <div><label>&nbsp;</label><label style="display:flex;gap:8px;align-items:center;text-transform:none;font-size:15px;color:var(--ink);font-weight:400;margin:0;padding:9px 0"><input type="checkbox" data-f="admin" style="width:auto" ${w.admin?"checked":""}> Admin</label></div></div>
      <div style="text-align:right"><button class="ghost danger" data-del="${i}">Remove</button></div></div>`).join("") || `<div class="card mute">No workers yet.</div>`}
    <div class="actions"><button class="pri" id="sSave">Save settings</button></div>`;
  $("#sOut").onclick = signOut; $("#sPin").onclick = () => choosePin(false);
  bindOrdersCard(); bindPhoneCard(); bindReminderCard();
  $("#addW").onclick = () => { const st=collectSettings(); st.workers.push({name:"",rego:"",email:"",pin:"",admin:false}); S.settings=st; viewSettings(); };
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ const st=collectSettings(); st.workers.splice(Number(b.dataset.del),1); S.settings=st; viewSettings(); });
  $("#sSave").onclick = async () => {
    const st = collectSettings(); st.workers = st.workers.filter(w=>w.name);
    if(!st.workers.some(w=>w.admin)){ toast("Keep at least one admin."); return; }
    if(st.workers.some(w=>!w.pin || w.pin.length<4)){ toast("Every worker needs a PIN of at least 4 digits."); return; }
    const names = st.workers.map(w=>w.name.toLowerCase()); if(new Set(names).size!==names.length){ toast("Two workers have the same name."); return; }
    $("#sSave").disabled = true;
    try{ await saveSettings(st); toast("Settings saved"); }catch(e){ writeErr(e); } finally { const b=$("#sSave"); if(b) b.disabled=false; }
  };
}
function collectSettings(){
  const ws=[...document.querySelectorAll("[data-w]")].map(r=>({name:r.querySelector('[data-f=name]').value.trim(), rego:r.querySelector('[data-f=rego]').value.trim().toUpperCase(),
    email:r.querySelector('[data-f=email]').value.trim(), pin:r.querySelector('[data-f=pin]').value.trim(), admin:r.querySelector('[data-f=admin]').checked}));
  const luS = $("#sLuS").value || "12:00", luF = $("#sLuF").value || "12:30";
  return Object.assign({fcmConfig:S.settings.fcmConfig||"", fcmVapid:S.settings.fcmVapid||""}, {company:$("#sCo").value.trim(), accessCode:($("#sAc") && $("#sAc").value.trim()) || S.settings.accessCode || "jones1898", lunchStart:luS, lunchFinish:luF, lunch:Math.max(0, (mins(luF)||0)-(mins(luS)||0)), ordinaryHours:Number($("#sOrd").value)||38, supplier:$("#sSup").value.trim(),
    adminEmail:$("#sAdm").value.trim(), jobEmail:$("#sJob").value.trim(), fromAlias:$("#sFrom").value.trim(), ccWorker:$("#sCc").checked, showPrices:$("#sPr").checked, tsOnly:$("#sTso").checked, emailQuery: ($("#oQ") && $("#oQ").value.trim()) || S.settings.emailQuery || "", workers:ws}, readReminderSettings());
}

</script>
<script>
if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost"))
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(e => console.warn("SW", e)));
</script>
</body>
</html>
